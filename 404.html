<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - TickerAI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- পাথটি রুট থেকে শুরু হবে -->
    <link rel="stylesheet" href="/css/tailwind.css" />
  </head>
  <body class="bg-gray-900 text-white" data-page="404">
    <!-- Navbar placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- 404 Content Section -->
    <main
      class="flex items-center justify-center"
      style="min-height: calc(100vh - 80px)"
    >
      <div class="text-center">
        <h1 class="text-9xl font-bold text-blue-600">404</h1>
        <p class="text-2xl md:text-3xl font-light text-gray-300 mt-4">
          Oops! Page Not Found.
        </p>
        <p class="mt-4 mb-8 text-gray-400">
          The page you are looking for might have been removed or is temporarily
          unavailable.
        </p>
        <a href="/" class="btn-primary">
          <i class="fas fa-home"></i> Go Back to Homepage
        </a>
      </div>
    </main>

    <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

    <!-- শুধুমাত্র main.js লোড হবে -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
