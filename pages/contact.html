<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - TickerAI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <!-- <link rel="stylesheet" href="../css/custom.css"> -->
  </head>
  <body class="bg-gray-900 text-slate-300">
    <!-- Include Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Contact Hero -->
    <section
      class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white pt-24 pb-12"
    >
      <div class="container mx-auto px-4 text-center">
        <h1 class="text-4xl font-bold mb-4">Get in Touch</h1>
        <p class="text-xl opacity-90">
          We're here to help with your financial intelligence needs
        </p>
      </div>
    </section>

    <!-- Contact Content -->
    <div class="container mx-auto px-4 py-12">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Contact Form -->
        <div class="lg:col-span-2">
          <div class="bg-gray-800 rounded-lg shadow-lg p-8">
            <h2 class="text-2xl font-bold mb-6">Send us a Message</h2>
            <form id="contactForm">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                  <label class="block text-sm font-semibold mb-2"
                    >First Name</label
                  >
                  <input
                    type="text"
                    required
                    class="w-full px-4 py-3 rounded-lg border border-gray-600 bg-gray-700 focus:border-blue-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label class="block text-sm font-semibold mb-2"
                    >Last Name</label
                  >
                  <input
                    type="text"
                    required
                    class="w-full px-4 py-3 rounded-lg border border-gray-600 bg-gray-700 focus:border-blue-500 focus:outline-none"
                  />
                </div>
              </div>

              <div class="mb-6">
                <label class="block text-sm font-semibold mb-2"
                  >Email Address</label
                >
                <input
                  type="email"
                  required
                  class="w-full px-4 py-3 rounded-lg border border-gray-600 bg-gray-700 focus:border-blue-500 focus:outline-none"
                />
              </div>

              <div class="mb-6">
                <label class="block text-sm font-semibold mb-2">Subject</label>
                <select
                  class="w-full px-4 py-3 rounded-lg border border-gray-600 bg-gray-700 focus:border-blue-500 focus:outline-none"
                >
                  <option>General Inquiry</option>
                  <option>Technical Support</option>
                  <option>Account Issues</option>
                  <option>Feature Request</option>
                  <option>Partnership</option>
                </select>
              </div>

              <div class="mb-6">
                <label class="block text-sm font-semibold mb-2">Message</label>
                <textarea
                  rows="5"
                  required
                  class="w-full px-4 py-3 rounded-lg border border-gray-600 bg-gray-700 focus:border-blue-500 focus:outline-none resize-none"
                ></textarea>
              </div>

              <button
                type="submit"
                class="w-full py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors"
              >
                Send Message
              </button>
            </form>
          </div>
        </div>

        <!-- Contact Info -->
        <div>
          <div class="bg-gray-800 rounded-lg shadow-lg p-8 mb-6">
            <h3 class="text-xl font-bold mb-4">Contact Information</h3>
            <div class="space-y-4">
              <div class="flex items-start gap-3">
                <i class="fas fa-map-marker-alt text-blue-600 mt-1"></i>
                <div>
                  <p class="font-semibold">Address</p>
                  <p class="text-gray-400">Dhaka, Bangladesh</p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <i class="fas fa-phone text-blue-600 mt-1"></i>
                <div>
                  <p class="font-semibold">Phone</p>
                  <p class="text-gray-400">+8801522101953</p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <i class="fas fa-envelope text-blue-600 mt-1"></i>
                <div>
                  <p class="font-semibold">Email</p>
                  <p class="text-gray-400">me.eyachirarafat@gmail.com</p>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-gray-800 rounded-lg shadow-lg p-8">
            <h3 class="text-xl font-bold mb-4">Follow Us</h3>
            <div class="flex gap-3">
              <a
                href="https://www.linkedin.com/in/eyachirarafat"
                class="social-link"
              >
                <i class="fab fa-linkedin"></i>
              </a>
              <a href="#" class="social-link">
                <i class="fab fa-twitter"></i>
              </a>
              <a href="#" class="social-link">
                <i class="fab fa-facebook"></i>
              </a>
              <a href="#" class="social-link">
                <i class="fab fa-youtube"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Include Footer -->
    <div id="footer-placeholder"></div>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/contact.js"></script>
    <script type="module" src="/js/components.js"></script>
  </body>
</html>
