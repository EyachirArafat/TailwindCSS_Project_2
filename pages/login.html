<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - TickerAI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <!-- <link rel="stylesheet" href="../css/custom.css" /> -->
  </head>
  <body
    class="bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 min-h-screen flex items-center justify-center"
  >
    <div class="container mx-auto px-4">
      <div class="max-w-md mx-auto">
        <!-- Logo -->
        <div class="text-center mb-8">
          <a href="../index.html">
            <img
              src="/assets/images/tickerAI-logo.png"
              alt="TickerAI"
              class="h-12 mx-auto mb-4"
            />
          </a>
          <h1 class="text-3xl font-bold text-white">Welcome Back</h1>
          <p class="text-blue-200 mt-2">Sign in to access your account</p>
        </div>

        <!-- Login Form -->
        <div class="bg-gray-900 rounded-xl shadow-2xl p-8">
          <form id="loginForm">
            <!-- Email Input -->
            <div class="mb-6">
              <label class="block text-gray-300 font-semibold mb-2">
                Email Address
              </label>
              <div class="relative">
                <input
                  type="email"
                  required
                  class="w-full px-4 py-3 pl-12 rounded-lg border border-gray-700 focus:border-blue-500 focus:outline-none text-gray-400"
                  placeholder="Enter your email"
                />
                <i
                  class="fas fa-envelope absolute left-4 top-4 text-gray-400"
                ></i>
              </div>
            </div>

            <!-- Password Input -->
            <div class="mb-6">
              <label class="block text-gray-300 font-semibold mb-2">
                Password
              </label>
              <div class="relative">
                <input
                  type="password"
                  required
                  class="w-full px-4 py-3 pl-12 rounded-lg border border-gray-700 focus:border-blue-500 focus:outline-none text-gray-400"
                  placeholder="Enter your password"
                />
                <i class="fas fa-lock absolute left-4 top-4 text-gray-400"></i>
                <button
                  type="button"
                  class="absolute right-4 top-4 text-gray-400 hover:text-gray-600"
                  onclick="togglePassword(this)"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex justify-between items-center mb-6">
              <label class="flex items-center">
                <input type="checkbox" class="mr-2" />
                <span class="text-gray-300">Remember me</span>
              </label>
              <a href="#" class="text-blue-600 hover:underline"
                >Forgot Password?</a
              >
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="w-full py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors"
            >
              Sign In
            </button>
          </form>

          <!-- Divider -->
          <div class="flex items-center my-6">
            <div class="flex-1 border-t border-gray-700"></div>
            <span class="px-4 text-gray-500">OR</span>
            <div class="flex-1 border-t border-gray-700"></div>
          </div>

          <!-- Social Login -->
          <div class="space-y-3">
            <button
              class="w-full py-3 border border-gray-700 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-800 transition-colors text-gray-400"
            >
              <img
                src="https://www.google.com/favicon.ico"
                alt="Google"
                class="w-5 h-5"
              />
              Continue with Google
            </button>
            <button
              class="w-full py-3 border border-gray-700 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-800 transition-colors text-gray-400"
            >
              <i class="fab fa-apple text-xl text-white"></i>
              Continue with Apple
            </button>
          </div>

          <!-- Sign Up Link -->
          <p class="text-center mt-6 text-gray-400">
            Don't have an account?
            <a
              href="register.html"
              class="text-blue-600 font-semibold hover:underline"
              >Sign Up</a
            >
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      function togglePassword(button) {
        const input = button.closest(".relative").querySelector("input");
        const icon = button.querySelector("i");

        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.replace("fa-eye-slash", "fa-eye");
        }
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          // Handle login logic
          console.log("Login submitted");
        });
    </script>
  </body>
</html>
