<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - TickerAI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <!-- <link rel="stylesheet" href="../css/custom.css"> -->
  </head>
  <body
    class="bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 min-h-screen flex items-center justify-center"
  >
    <div class="container mx-auto px-4 py-8">
      <div class="max-w-md mx-auto">
        <!-- Logo -->
        <div class="text-center mb-8">
          <a href="../index.html">
            <img
              src="../assets/tickerAI-logo-white.png"
              alt="TickerAI"
              class="h-12 mx-auto mb-4"
            />
          </a>
          <h1 class="text-3xl font-bold text-white">Create Account</h1>
          <p class="text-blue-200 mt-2">Join thousands of smart investors</p>
        </div>

        <!-- Registration Form -->
        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-2xl p-8">
          <form id="registerForm">
            <!-- Progress Indicator -->
            <div class="flex justify-between mb-8">
              <div class="step active" data-step="1">
                <div class="step-circle">1</div>
                <span class="step-label">Account</span>
              </div>
              <div class="step" data-step="2">
                <div class="step-circle">2</div>
                <span class="step-label">Profile</span>
              </div>
              <div class="step" data-step="3">
                <div class="step-circle">3</div>
                <span class="step-label">Preferences</span>
              </div>
            </div>

            <!-- Step 1: Account Info -->
            <div class="step-content" id="step1">
              <div class="mb-4">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Full Name
                </label>
                <div class="relative">
                  <input
                    type="text"
                    required
                    name="fullName"
                    class="w-full px-4 py-3 pl-12 rounded-lg border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none dark:bg-gray-800"
                    placeholder="John Doe"
                  />
                  <i
                    class="fas fa-user absolute left-4 top-4 text-gray-400"
                  ></i>
                </div>
              </div>

              <div class="mb-4">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Email Address
                </label>
                <div class="relative">
                  <input
                    type="email"
                    required
                    name="email"
                    class="w-full px-4 py-3 pl-12 rounded-lg border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none dark:bg-gray-800"
                    placeholder="john@example.com"
                  />
                  <i
                    class="fas fa-envelope absolute left-4 top-4 text-gray-400"
                  ></i>
                </div>
              </div>

              <div class="mb-4">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Password
                </label>
                <div class="relative">
                  <input
                    type="password"
                    required
                    name="password"
                    id="password"
                    class="w-full px-4 py-3 pl-12 rounded-lg border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none dark:bg-gray-800"
                    placeholder="Min 8 characters"
                  />
                  <i
                    class="fas fa-lock absolute left-4 top-4 text-gray-400"
                  ></i>
                  <button
                    type="button"
                    class="absolute right-4 top-4 text-gray-400 hover:text-gray-600"
                    onclick="togglePassword('password')"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <div class="password-strength mt-2">
                  <div class="strength-bar"></div>
                </div>
              </div>

              <div class="mb-6">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Confirm Password
                </label>
                <div class="relative">
                  <input
                    type="password"
                    required
                    name="confirmPassword"
                    id="confirmPassword"
                    class="w-full px-4 py-3 pl-12 rounded-lg border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none dark:bg-gray-800"
                    placeholder="Repeat password"
                  />
                  <i
                    class="fas fa-lock absolute left-4 top-4 text-gray-400"
                  ></i>
                </div>
              </div>
            </div>

            <!-- Step 2: Profile Info -->
            <div class="step-content hidden" id="step2">
              <div class="mb-4">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Phone Number
                </label>
                <div class="relative">
                  <input
                    type="tel"
                    name="phone"
                    class="w-full px-4 py-3 pl-12 rounded-lg border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none dark:bg-gray-800"
                    placeholder="+1 (555) 123-4567"
                  />
                  <i
                    class="fas fa-phone absolute left-4 top-4 text-gray-400"
                  ></i>
                </div>
              </div>

              <div class="mb-4">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Country
                </label>
                <select
                  name="country"
                  class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none dark:bg-gray-800"
                >
                  <option value="">Select Country</option>
                  <option value="US">United States</option>
                  <option value="UK">United Kingdom</option>
                  <option value="CA">Canada</option>
                  <option value="AU">Australia</option>
                  <option value="IN">India</option>
                </select>
              </div>

              <div class="mb-4">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Investment Experience
                </label>
                <select
                  name="experience"
                  class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 focus:border-blue-500 focus:outline-none dark:bg-gray-800"
                >
                  <option value="beginner">Beginner (0-2 years)</option>
                  <option value="intermediate">Intermediate (2-5 years)</option>
                  <option value="advanced">Advanced (5+ years)</option>
                  <option value="professional">Professional Trader</option>
                </select>
              </div>

              <div class="mb-6">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Investment Goals
                </label>
                <div class="space-y-2">
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="goals"
                      value="growth"
                      class="mr-2"
                    />
                    <span>Long-term Growth</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="goals"
                      value="income"
                      class="mr-2"
                    />
                    <span>Income Generation</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="goals"
                      value="trading"
                      class="mr-2"
                    />
                    <span>Active Trading</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="goals"
                      value="preservation"
                      class="mr-2"
                    />
                    <span>Capital Preservation</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Step 3: Preferences -->
            <div class="step-content hidden" id="step3">
              <div class="mb-4">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Interested Markets
                </label>
                <div class="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    class="market-select-btn"
                    data-market="stocks"
                  >
                    <i class="fas fa-chart-line"></i> Stocks
                  </button>
                  <button
                    type="button"
                    class="market-select-btn"
                    data-market="crypto"
                  >
                    <i class="fab fa-bitcoin"></i> Crypto
                  </button>
                  <button
                    type="button"
                    class="market-select-btn"
                    data-market="forex"
                  >
                    <i class="fas fa-exchange-alt"></i> Forex
                  </button>
                  <button
                    type="button"
                    class="market-select-btn"
                    data-market="commodities"
                  >
                    <i class="fas fa-coins"></i> Commodities
                  </button>
                </div>
              </div>

              <div class="mb-4">
                <label
                  class="block text-gray-700 dark:text-gray-300 font-semibold mb-2"
                >
                  Newsletter Preferences
                </label>
                <div class="space-y-2">
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="newsletter"
                      value="daily"
                      class="mr-2"
                    />
                    <span>Daily Market Summary</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="newsletter"
                      value="weekly"
                      class="mr-2"
                    />
                    <span>Weekly Analysis</span>
                  </label>
                  <label class="flex items-center">
                    <input
                      type="checkbox"
                      name="newsletter"
                      value="alerts"
                      class="mr-2"
                    />
                    <span>Price Alerts</span>
                  </label>
                </div>
              </div>

              <div class="mb-6">
                <label class="flex items-center">
                  <input type="checkbox" required class="mr-2" />
                  <span class="text-sm"
                    >I agree to the
                    <a href="#" class="text-blue-600 hover:underline"
                      >Terms of Service</a
                    >
                    and
                    <a href="#" class="text-blue-600 hover:underline"
                      >Privacy Policy</a
                    ></span
                  >
                </label>
              </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex justify-between">
              <button
                type="button"
                id="prevBtn"
                class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 hidden"
              >
                Previous
              </button>
              <button
                type="button"
                id="nextBtn"
                class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 ml-auto"
              >
                Next
              </button>
              <button
                type="submit"
                id="submitBtn"
                class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 w-full hidden"
              >
                Create Account
              </button>
            </div>
          </form>

          <!-- Sign In Link -->
          <p class="text-center mt-6 text-gray-600 dark:text-gray-400">
            Already have an account?
            <a
              href="login.html"
              class="text-blue-600 font-semibold hover:underline"
              >Sign In</a
            >
          </p>
        </div>
      </div>
    </div>

    <script src="../js/register.js"></script>
  </body>
</html>
