<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/tailwind.css">
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 min-h-screen flex items-center justify-center">
  <div class="text-center text-white">
    <h1 class="text-9xl font-bold mb-4">404</h1>
    <p class="text-2xl mb-8">Oops! Page not found</p>
    <p class="text-lg mb-8 opacity-80">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex gap-4 justify-center">
      <a href="/" class="px-6 py-3 bg-white text-blue-900 rounded-lg font-semibold hover:bg-gray-100">
        Go Home
      </a>
      <button onclick="history.back()" class="px-6 py-3 border-2 border-white rounded-lg font-semibold hover:bg-white hover:text-blue-900">
        Go Back
      </button>
    </div>
  </div>
</body>
</html>
